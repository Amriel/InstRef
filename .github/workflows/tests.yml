name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        # Qt needs a display even for widgets that are never shown.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q

      - name: Byte-compile every module
        run: python -c "import compileall,sys; sys.exit(0 if compileall.compile_dir('igsaved', quiet=1) else 1)"
